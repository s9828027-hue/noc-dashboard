<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOC 監控大螢幕</title>
<style>
/* ── 色彩(暗色,電視牆用)。角色名稱取代色碼,之後換色只改這裡 ── */
:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232321;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --s1: #3987e5;      /* 類別 1:藍 -> IN / 單一數量 */
  --s3: #199e70;      /* 類別 3:青綠 -> OUT */
  --track: #0d366b;   /* 藍色 ramp 的深階,當 meter 底軌 */
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --land: #262624;
}
* { box-sizing: border-box; }
/* 字級同時跟著視窗寬和高縮放(取較小者):1920×1080 = 18px;視窗比較矮(例如 1890×805)也不會內容溢出 */
html { font-size: clamp(10px, min(0.9375vw, 1.6667vh), 24px); }   /* 備援值;實際字級由下方 JS fitScreen() 依畫面比例計算 */
body {
  margin: 0; background: var(--page); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  line-height: 1.35; height: 100vh; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

/* 用 flex 直排:提醒橫幅隱藏時,主內容也會自動撐滿剩下的高度(之前用 grid 三列,橫幅隱藏後主內容只佔「自動」那一列,下面會空一大塊) */
.app { height: 100vh; display: flex; flex-direction: column; gap: 0.7rem; padding: 0.8rem 1rem 1rem; }
.app > .main { flex: 1 1 0; min-height: 0; }

/* ── 頂部 ── */
.top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.top h1 { font-size: 1.5rem; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
.top .sub { color: var(--muted); font-size: 0.8rem; }
.topright { display: flex; align-items: center; gap: 1.1rem; }
.riskchip { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.8rem; border-radius: 8px; font: inherit; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
            border: 1px solid var(--border); background: transparent; color: var(--ink-2); }
.riskchip[hidden] { display: none; }
.riskchip:hover { background: var(--surface-2); }
.riskchip.unread { border-color: #ff4d6d; color: var(--ink); font-weight: 600; background: color-mix(in srgb, #ff4d6d 20%, transparent); animation: riskpulse 2s ease-in-out infinite; }
@keyframes riskpulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, #ff4d6d 55%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: reduce) { .riskchip.unread { animation: none; } }
.chip.fresh { border-color: #ff4d6d; color: var(--ink); background: color-mix(in srgb, #ff4d6d 28%, transparent); }
.clock { text-align: right; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.clock small { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 400; }

.banner { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.9rem; border-radius: 8px;
          background: var(--surface); border: 1px solid var(--border); font-size: 0.9rem; color: var(--ink-2); }
.banner.crit { border-color: var(--crit); color: var(--ink); background: color-mix(in srgb, var(--crit) 16%, var(--surface)); }
.banner[hidden] { display: none; }

/* ── 版面 ── */
.main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0.8rem; min-height: 0; }
.col { display: grid; gap: 0.8rem; min-height: 0; }
.col.left { grid-template-rows: 1fr auto; }
.col.right { grid-template-rows: auto 1fr; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.8rem 1rem;
         min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; transition: opacity .2s; }
.panel.reloading { opacity: 0.85; }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; margin-bottom: 0.55rem; }
.panel h2 { font-size: 1.05rem; font-weight: 600; margin: 0; color: var(--ink); }
.panel .tools { display: flex; align-items: center; gap: 0.9rem; color: var(--ink-2); font-size: 0.8rem; }
.panel .body { min-height: 0; flex: 1; display: flex; flex-direction: column; }
.empty { color: var(--muted); padding: 1rem 0; font-size: 0.95rem; }

.chip { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.05rem 0.5rem; border-radius: 6px; font-size: 0.75rem;
        border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
.chip.warn { border-color: var(--warn); color: var(--ink); }
.chip.crit { border-color: var(--crit); color: var(--ink); background: color-mix(in srgb, var(--crit) 22%, transparent); }
.chip.good { border-color: color-mix(in srgb, var(--good) 60%, transparent); color: var(--ink); }
.chip.accent { border-color: var(--s1); color: var(--ink); }
.key { display: inline-flex; align-items: center; gap: 0.35rem; }
.key i { display: inline-block; width: 0.8rem; height: 0.55rem; border-radius: 2px; }
svg.icon { width: 1em; height: 1em; flex: none; vertical-align: -0.12em; }

/* ── meter ── */
.meter { position: relative; height: 0.85rem; border-radius: 4px; background: color-mix(in srgb, var(--mc, var(--s1)) 22%, var(--surface)); }
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--mc, var(--s1)); min-width: 2px; }
.meter .fill.over { background: var(--crit); }
.meter .fill.warnf { background: var(--warn); }
.meter .thr.w { background: var(--warn); }
.meter .thr.c { background: var(--crit); }
.meter .thr { position: absolute; top: -0.25rem; bottom: -0.25rem; width: 2px; background: var(--ink); opacity: 0.85; }

/* ── 線路 ── */
.lines { display: grid; gap: 0.35rem; flex: 1; align-content: space-evenly; }
.row { display: grid; grid-template-columns: 19rem 1fr 1fr; gap: 0.9rem; align-items: center; text-align: left; width: 100%;
       background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 0.4rem 0.4rem; cursor: pointer; }
.row:hover { background: var(--surface-2); }
.row .name { font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--muted); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.alert { border-color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.row.warnrow { border-color: color-mix(in srgb, var(--warn) 70%, transparent); background: color-mix(in srgb, var(--warn) 9%, transparent); }
.dir { display: grid; grid-template-columns: 2.2rem 1fr 5.6rem; gap: 0.6rem; align-items: center; }
.dir .vbox { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.dir .d { color: var(--ink-2); font-size: 0.75rem; }
.dir .v { text-align: right; font-weight: 600; font-size: 1.05rem; white-space: nowrap; }
.dir .mb { color: var(--muted); font-size: 0.72rem; white-space: nowrap; }

/* ── 防火牆 ── */
.fwgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
.fw { border: 1px solid var(--border); border-radius: 10px; padding: 0.65rem 0.8rem; background: var(--surface-2); }
.fw header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
.fw h3 { margin: 0; font-size: 1rem; }
.stat { display: flex; align-items: baseline; gap: 0.5rem; }
.stat .big { font-size: 2rem; font-weight: 600; }
.stat .lbl { color: var(--ink-2); font-size: 0.8rem; }
.mrow { display: grid; grid-template-columns: 6.4rem 1fr 3rem; gap: 0.5rem; align-items: center; margin-top: 0.3rem; font-size: 0.8rem; color: var(--ink-2); }
.mrow .val { text-align: right; color: var(--ink); font-weight: 600; }
.fw .small { color: var(--muted); font-size: 0.75rem; margin-top: 0.45rem; display: flex; flex-wrap: wrap; gap: 0.2rem 0.9rem; }
.fw .small b { color: var(--ink-2); font-weight: 600; }
.cluster { margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.9rem; color: var(--ink-2); }

/* ── 存活率 ── */
.avail { display: grid; gap: 0.3rem; }
.arow { display: grid; grid-template-columns: 1.6fr 1.1fr 0.9fr 0.9fr 1.2fr; gap: 0.6rem; align-items: center;
        padding: 0.35rem 0.4rem; border-radius: 8px; font-size: 0.95rem; }
.arow.head { color: var(--muted); font-size: 0.72rem; padding-bottom: 0; }
.arow.alert { background: color-mix(in srgb, var(--crit) 14%, transparent); border: 1px solid var(--crit); }
.arow .name { font-weight: 600; }
.arow .num { font-variant-numeric: tabular-nums; }
.arow .om { color: var(--muted); font-size: 0.8rem; }

/* ── 威脅地圖 ── */
.threat { display: flex; flex-direction: column; gap: 0.6rem; min-height: 0; flex: 1; }
.mapbox { min-height: 0; flex: 0 1 auto; display: flex; justify-content: center; }
.mapbox svg { width: 100%; height: auto; max-height: 100%; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 0.15rem 0.7rem; cursor: pointer; color: var(--ink-2); font-size: 0.8rem; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.threat.globe { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 1rem; flex: 1; }
.globebox { position: relative; min-height: 0; display: flex; flex-direction: column; }
.gstage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.gnote { color: var(--muted); font-size: 0.72rem; }
.gcap { text-align: center; font-weight: 600; font-size: 0.95rem; min-height: 1.4em; }
.rank.single { grid-template-columns: 1fr; gap: 0.15rem; align-content: start; overflow: hidden; min-height: 0; }
button.item { background: transparent; border: 0; border-radius: 8px; padding: 0.22rem 0.4rem; cursor: pointer; color: inherit; text-align: left; width: 100%; }
button.item:hover { background: var(--surface-2); }
.item.focus { background: var(--surface-2); }
.rank { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1.4rem; align-content: start; align-items: start; }
.rank .item { align-content: start; display: grid; grid-template-columns: 5.5rem 1fr 4.4rem; gap: 0.5rem; align-items: center; font-size: 0.85rem; }
.rrow { display: contents; }
.rrow .cn { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .val { text-align: right; font-weight: 600; }
.rbar { height: 0.7rem; background: transparent; }
.rank.out .rbar div { background: var(--s3); }
.rbar div { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.tags { grid-column: 1 / -1; display: flex; gap: 0.3rem; margin-top: -0.15rem; flex-wrap: wrap; }
.foot { color: var(--muted); font-size: 0.7rem; margin-top: 0.4rem; }
.foot a { color: var(--ink-2); }
table.t { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
table.t th { text-align: left; color: var(--muted); font-weight: 500; padding: 0.25rem 0.5rem; border-bottom: 1px solid var(--axis); position: sticky; top: 0; background: var(--surface); }
table.t td { padding: 0.28rem 0.5rem; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.t .natline { margin-top: 0.15rem; font-size: 0.76rem; color: var(--ink-2); display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
table.t .natline .nip { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
table.t .natline.none { color: var(--muted); }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow: auto; height: 100%; }

/* ── 彈窗 ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.62); display: flex; align-items: center; justify-content: center; z-index: 20; }
.overlay[hidden] { display: none; }
.modal { width: min(70rem, 92vw); max-height: 88vh; display: flex; flex-direction: column; background: var(--surface);
         border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.2rem; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
.modal.alert { border-color: var(--crit); }
.modal header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.modal h2 { margin: 0; font-size: 1.3rem; display: flex; align-items: center; gap: 0.6rem; }
.modal .meta { color: var(--ink-2); font-size: 0.85rem; margin: 0.4rem 0 0.7rem; }
.modal .note { color: var(--muted); font-size: 0.78rem; margin-top: 0.7rem; }
.xbtn { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 0.2rem 0.7rem; cursor: pointer; font-size: 1rem; }
.xbtn:hover { background: var(--surface-2); }
.pbar { display: inline-block; height: 0.55rem; background: var(--s1); border-radius: 0 3px 3px 0; vertical-align: middle; margin-left: 0.4rem; }

#tip { position: fixed; z-index: 30; pointer-events: none; background: #000; color: var(--ink); border: 1px solid var(--axis); border-radius: 8px;
       padding: 0.35rem 0.6rem; font-size: 0.8rem; max-width: 22rem; display: none; }
#tip b { font-size: 0.95rem; }
#tip .s { color: var(--ink-2); display: block; }


/* ── 地圖彈窗 ── */
.modal.wide { width: min(96rem, 96vw); }
.gtop { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
.zoombtn { cursor: pointer; background: transparent; font-size: 0.72rem; }
.zoombtn:hover { background: var(--surface-2); }
.mapmodal { display: grid; grid-template-columns: minmax(0, 2.3fr) minmax(17rem, 1fr); gap: 1rem; min-height: 0; flex: 1; overflow: hidden; }
.mapcol { min-width: 0; display: flex; flex-direction: column; gap: 0.5rem; justify-content: flex-start; }
.listcol { min-height: 0; max-height: 100%; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 1.1rem; font-size: 0.8rem; color: var(--ink-2); }
.legend .lg-title { color: var(--muted); }
.legend .lg { display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
.legend .lg i { display: inline-block; width: 1.8rem; border-radius: 2px; }
.legend .lg b { color: var(--ink); }
.mlist { display: grid; gap: 0.1rem; }
.mrow2 { display: grid; grid-template-columns: 1.4rem 0.8rem 1fr auto 3.4rem 2.6rem; gap: 0.5rem; align-items: center; font-size: 0.85rem; padding: 0.25rem 0.4rem; border-radius: 6px; }
.mrow2:hover { background: var(--surface-2); }
.mrow2 .rk { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.mrow2 .sw { width: 0.8rem; height: 0.5rem; border-radius: 2px; }
.mrow2 .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow2 .gb, .mrow2 .pc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.mrow2 .pc, .mrow2 .lv { color: var(--ink-2); font-weight: 400; font-size: 0.78rem; }
.mrow2 .tags { grid-column: 3 / -1; margin-top: 0; }

/* 地圖動畫 */
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes flowdash { to { stroke-dashoffset: -32; } }
@keyframes ripple { from { transform: scale(0.5); opacity: 0.75; } to { transform: scale(2.8); opacity: 0; } }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.arc.intro { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s ease-out forwards; animation-delay: var(--d, 0s); }
.flow { stroke-dasharray: 2 14; animation: flowdash var(--fd, 1.6s) linear infinite; }
.flow.rev { animation-direction: reverse; }
.flow.fintro { animation: flowdash var(--fd, 1.6s) linear infinite, fadein 0.5s ease-out both; animation-delay: 0s, var(--fdel, 1.4s); }
.flow.rev.fintro { animation-direction: reverse, normal; }
.packet.pfade { animation: fadein 0.6s ease-out both; animation-delay: var(--fdel, 1.5s); }
.ripple { transform-box: fill-box; transform-origin: center; animation: ripple 2.4s ease-out infinite; }
.ripple.home { animation-duration: 2.8s; }
.dotpop { transform-box: fill-box; transform-origin: center; animation: pop 0.45s cubic-bezier(.2,1.4,.4,1) both; animation-delay: var(--d, 0s); }
svg.hl [data-iso] { opacity: 0.14; transition: opacity 0.2s; }
svg.hl [data-iso].on { opacity: 1; }
svg [data-iso] { transition: opacity 0.2s; }
.mrow2.on { background: var(--surface-2); }
/* 高風險連線彈窗 */
svg.rhl [data-riso] { opacity: 0.25; transition: opacity 0.2s; }
svg.rhl [data-riso].on { opacity: 1; }
.rgroup { border: 1px solid color-mix(in srgb, #ff4d6d 60%, transparent); background: color-mix(in srgb, #ff4d6d 8%, transparent); border-radius: 8px; padding: 0.45rem 0.65rem 0.5rem; margin-bottom: 0.55rem; }
.rgroup.on { background: color-mix(in srgb, #ff4d6d 16%, transparent); }
.rgroup > .rh { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.95rem; }
.rhit { margin-top: 0.4rem; padding-top: 0.35rem; border-top: 1px solid var(--grid); font-size: 0.82rem; display: grid; gap: 0.12rem; }
.rhit .ip { font-weight: 700; font-size: 0.98rem; font-variant-numeric: tabular-nums; }
.rhit .sub { color: var(--ink-2); }
.rhit .nat { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; color: var(--ink); }
.banner.risk { cursor: pointer; }
svg.noanim *, svg.noanim { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .arc.intro, .flow, .ripple, .dotpop { animation: none !important; } }
@media (max-width: 1100px) { .mapmodal { grid-template-columns: 1fr; } }

/* ── 自動版型:依畫面比例切換(由 JS 設定 <html data-mode>)──
   std   = 一般橫式(16:9、16:10、4:3 …):左右兩欄
   ultra = 超寬(21:9、32:9 …):三欄,每一欄都比較矮
   tall  = 直立(電視牆轉 90 度、手機直立):單欄由上往下
   字級 = 讓該版型的「設計尺寸」剛好塞進視窗(取寬、高較吃緊的那個),所以任何大小都不會被切到。 */
html[data-mode="ultra"] .col, html[data-mode="tall"] .col { display: contents; }
html[data-mode="ultra"] #p-lines, html[data-mode="tall"] #p-lines { grid-area: lines; }
html[data-mode="ultra"] #p-fw, html[data-mode="tall"] #p-fw { grid-area: fw; }
html[data-mode="ultra"] #p-avail, html[data-mode="tall"] #p-avail { grid-area: avail; }
html[data-mode="ultra"] #p-threat, html[data-mode="tall"] #p-threat { grid-area: threat; }
html[data-mode="ultra"] .main { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1.2fr); grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "lines fw threat" "lines avail threat"; }
html[data-mode="ultra"] .row { grid-template-columns: 1fr 1fr; row-gap: 0.15rem; }   /* 欄位窄:名稱獨佔一行,IN/OUT 左右並排 */
html[data-mode="ultra"] .row > :first-child { grid-column: 1 / -1; }
html[data-mode="ultra"] #p-fw .foot, html[data-mode="ultra"] #p-avail .foot { display: none; }   /* 超寬螢幕高度有限,次要說明文字先收起來 */
html[data-mode="tall"] .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.05fr) auto minmax(0, 0.85fr) minmax(0, 1.5fr);
  grid-template-areas: "lines" "fw" "avail" "threat"; }

/* 視窗真的太小(連最小字級都塞不下)才允許捲動 */
html[data-fit="scroll"] body { height: auto; overflow: auto; }
html[data-fit="scroll"] .app { height: auto; min-height: 100vh; }
html[data-fit="scroll"] .main, html[data-fit="scroll"] .col { display: flex; flex-direction: column; }
html[data-fit="scroll"] .panel { overflow: visible; }
html[data-fit="scroll"] .threat.globe { min-height: 26rem; }
html[data-fit="scroll"] .row { grid-template-columns: 1fr; }
@media (max-width: 1100px) { .mapmodal { grid-template-columns: 1fr; } }

/* ── Meraki 大樓無線 AP(左下角面板 + 樓層平面圖彈窗) ── */
.riskchip.okchip, .riskchip.warnchip, .riskchip.badchip { cursor: default; }
.riskchip.badchip { border-color: var(--crit); color: var(--ink); background: color-mix(in srgb, var(--crit) 18%, transparent); }
.riskchip.warnchip { border-color: var(--warn); color: var(--ink); }
#tip { white-space: pre-line; }
svg.apicon { width: 1em; height: 1em; flex: none; vertical-align: -0.12em; overflow: visible; }
.bcard { display: grid; grid-template-columns: minmax(0, 26rem) minmax(0, 1fr); gap: 1.2rem; flex: 1; min-height: 0; align-items: start; }
.bsvg { display: block; width: 100%; height: auto; max-height: 100%; font-family: inherit; }
.floorg { cursor: pointer; }
.floorg:hover .hit, .floorg:focus-visible .hit { fill: rgba(127,180,255,.10); }
.floorg:focus-visible { outline: none; }
.bsum { display: flex; flex-direction: column; gap: 0.55rem; min-width: 0; }
.bchips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.bchip { flex: 1 1 4.6rem; background: var(--surface-2); border-radius: 8px; padding: 0.2rem 0.6rem; min-width: 0; }
.bchip span { font-size: 0.72rem; color: var(--ink-2); display: flex; align-items: center; gap: 0.25rem; white-space: nowrap; }
.bchip b { font-size: 1.35rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.bblk { background: var(--surface-2); border-radius: 8px; padding: 0.4rem 0.75rem; }
.bblk .hd { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.15rem; display: flex; justify-content: space-between; gap: 0.5rem; }
.bit { display: grid; grid-template-columns: 1.2rem 1fr auto; gap: 0.5rem; align-items: center; font-size: 0.92rem; padding: 0.2rem 0; border: 0; border-bottom: 1px solid var(--grid);
       background: transparent; width: 100%; text-align: left; color: inherit; }
.bit:last-child { border-bottom: 0; }
.bit small { color: var(--muted); font-size: 0.78rem; }
.bit > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.bit small { white-space: nowrap; }
button.bit.link { cursor: pointer; }
button.bit.link:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.bt3 { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.85rem; padding: 0.15rem 0; border-bottom: 1px solid var(--grid); color: var(--ink-2); }
.bt3:last-child { border-bottom: 0; }
.bt3 b { color: var(--ink); font-weight: 600; }
.spark { display: block; width: 100%; height: 2.6rem; }

html[data-mode="ultra"] .bcard { grid-template-columns: minmax(0, 17rem) minmax(0, 1fr); gap: 0.8rem; }
html[data-mode="tall"] .bcard { grid-template-columns: minmax(0, 20rem) minmax(0, 1fr); gap: 0.9rem; }
html[data-mode="ultra"] .bchip b { font-size: 1.15rem; }
html[data-mode="tall"][data-meraki] .main { grid-template-rows: minmax(0, 1.05fr) auto auto minmax(0, 1.5fr); }
html[data-mode="ultra"] .bblk.opt { display: none; }

/* 樓層平面圖彈窗 */
.modal.plan { width: min(100rem, 96vw); }
.modal.plan .mapmodal.apmodal { grid-template-columns: minmax(0, 1fr) minmax(16rem, 21rem); }
.seg.floors { flex-wrap: nowrap; }
.seg.floors button { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.15rem 0.55rem; white-space: nowrap; }
.xbtn[aria-pressed="true"] { background: var(--surface-2); }
.plancol { min-width: 0; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
.planbox { --ar: 1.6; position: relative; width: min(100%, calc((88vh - 13rem) * var(--ar))); aspect-ratio: var(--ar); border: 1px solid rgba(140,180,255,.18); border-radius: 10px; overflow: hidden;
  background: linear-gradient(rgba(120,160,230,.05) 1px, transparent 1px) 0 0/2.2rem 2.2rem, linear-gradient(90deg, rgba(120,160,230,.05) 1px, transparent 1px) 0 0/2.2rem 2.2rem; }
.planbox img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none;
  filter: invert(1) drop-shadow(0 0 2px rgba(120,180,255,.55)); mix-blend-mode: screen; opacity: .66; }
.planbox.orig img { filter: none; mix-blend-mode: normal; opacity: 1; }
.planbox .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.apdot { position: absolute; width: 1.15rem; height: 1.15rem; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; z-index: 2; }
.apdot svg.apicon { width: 100%; height: 100%; filter: drop-shadow(0 0 3px rgba(0,0,0,.9)); }
.apdot .lb { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font-size: 0.62rem; color: var(--ink); white-space: nowrap; text-shadow: 0 0 3px #000, 0 0 3px #000; display: none; pointer-events: none; }
.planbox.names .apdot .lb, .apdot.bad .lb { display: block; }
.apdot.bad { width: 1.5rem; height: 1.5rem; z-index: 3; }
.apdot.bad::after { content: ""; position: absolute; inset: -0.35rem; border-radius: 50%; border: 2px solid var(--crit); animation: apring 1.8s ease-out infinite; pointer-events: none; }
.apdot.warn.bad::after { border-color: var(--warn); }
@keyframes apring { from { transform: scale(.55); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .apdot.bad::after { animation: none; opacity: .7; } }
.aplist { display: grid; gap: 0.15rem; align-content: start; }
.aprow { display: grid; grid-template-columns: 1.3rem 1fr auto; gap: 0.5rem; align-items: center; padding: 0.3rem 0.45rem; border-radius: 8px; border: 1px solid transparent; }
.aprow .n { font-size: 0.92rem; font-weight: 600; }
.aprow .s { font-size: 0.75rem; color: var(--muted); }
.aprow .r { text-align: right; }
.aprow.crit { border-color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.aprow.warn { border-color: color-mix(in srgb, var(--warn) 70%, transparent); background: color-mix(in srgb, var(--warn) 9%, transparent); }

/* 搜尋 */
.modal.find { width: min(56rem, 94vw); }
.finput { width: 100%; font: inherit; font-size: 1.3rem; padding: 0.55rem 0.9rem; border-radius: 10px; border: 1px solid var(--s1); background: var(--surface-2); color: var(--ink); margin-bottom: 0.7rem; }
.finput::placeholder { color: var(--muted); }
.fres { max-height: 52vh; display: grid; gap: 0.25rem; align-content: start; }
.focuscard .n { font-size: 1.05rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focuscard .s { font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fwhere { text-align: right; min-width: 0; }
.fdot { width: 0.8rem; height: 0.8rem; border-radius: 50%; display: inline-block; }
.fdot.on { background: var(--good); }
.fdot.off { border: 2px solid var(--muted); }
.focuscard { display: grid; grid-template-columns: 0.9rem minmax(0, 1fr) auto; gap: 0.8rem; align-items: center; padding: 0.4rem 0.8rem; margin-bottom: 0.6rem;
  border: 1px solid #4fd1ff; border-radius: 10px; background: color-mix(in srgb, #4fd1ff 10%, transparent); }
.focuscard .r { text-align: right; }
.apdot.focus { width: 2rem; height: 2rem; z-index: 5; border-radius: 50%; outline: 3px solid #4fd1ff; box-shadow: 0 0 0 0.45rem rgba(79,209,255,.28), 0 0 1.2rem rgba(79,209,255,.8); }
.apdot.focus::before { content: ""; position: absolute; inset: -0.55rem; border-radius: 50%; border: 3px solid #4fd1ff; animation: apring 1.4s ease-out infinite; pointer-events: none; }
.apdot.focus .lb { display: block; font-weight: 700; background: rgba(0,0,0,.65); padding: 0 0.3rem; border-radius: 4px; }
.aprow.focus { border-color: #4fd1ff; background: color-mix(in srgb, #4fd1ff 12%, transparent); }
@media (prefers-reduced-motion: reduce) { .apdot.focus::before { animation: none; } }
.modal.plan.withfocus .planbox { width: min(100%, calc((88vh - 17.5rem) * var(--ar))); }

/* ── 手機 / 視窗太小(data-fit="scroll"):改成單欄、由上往下捲動,面板不會互相蓋住 ── */
html[data-fit="scroll"] .app > .main, html[data-fit="scroll"] .main { display: flex; flex-direction: column; flex: none; gap: 0.8rem; }
html[data-fit="scroll"] .col { display: contents; }
html[data-fit="scroll"] .panel { flex: none; overflow: visible; }
html[data-fit="scroll"] #p-lines { order: 1; } html[data-fit="scroll"] #p-fw { order: 2; }
html[data-fit="scroll"] #p-avail { order: 3; } html[data-fit="scroll"] #p-threat { order: 4; }
html[data-fit="scroll"] .bcard, html[data-fit="scroll"] .fwgrid, html[data-fit="scroll"] .threat.globe { grid-template-columns: 1fr; }
html[data-fit="scroll"] .threat.globe { grid-template-rows: auto; }
html[data-fit="scroll"] .top { flex-wrap: wrap; gap: 0.4rem; }
html[data-fit="scroll"] .topright { flex-wrap: wrap; gap: 0.5rem; justify-content: flex-end; }
html[data-fit="scroll"] .panel > header { flex-wrap: wrap; }
html[data-fit="scroll"] .modal { overflow: auto; max-height: 92vh; }
html[data-fit="scroll"] .mapmodal { overflow: visible; }
html[data-fit="scroll"] .modal.plan .mapmodal.apmodal { grid-template-columns: 1fr; }
html[data-fit="scroll"] .planbox, html[data-fit="scroll"] .modal.plan.withfocus .planbox { width: 100%; }
html[data-fit="scroll"] .seg button { white-space: nowrap; padding: 0.15rem 0.5rem; }
html[data-fit="scroll"] .panel .tools { flex-wrap: wrap; gap: 0.4rem 0.7rem; }
html[data-fit="scroll"] .modal header { flex-wrap: wrap; gap: 0.5rem; }
html[data-fit="scroll"] .modal h2 { white-space: nowrap; font-size: 1.15rem; }
html[data-fit="scroll"] .seg.floors { max-width: 100%; overflow-x: auto; }
html[data-fit="scroll"] .modal header > div { justify-content: flex-start !important; }

/* 搜尋結果列:外層一列 = 可點的主體 + 診斷按鈕 */
.frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: stretch; padding: 0; border: 0; background: transparent; }
.fbody { display: grid; grid-template-columns: 0.9rem minmax(0, 1.3fr) minmax(0, 1fr); gap: 0.8rem; align-items: center; text-align: left; width: 100%;
         padding: 0.45rem 0.7rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: inherit; font: inherit; }
button.fbody.link { cursor: pointer; }
button.fbody.link:hover { background: var(--surface-2); border-color: var(--s1); }
.fbody .n { font-size: 1.05rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbody .s { font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fdiag { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.8rem; border-radius: 8px; border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
         color: var(--ink); font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.fdiag:hover { background: color-mix(in srgb, var(--warn) 24%, transparent); }
.fdiag svg { width: 1rem; height: 1rem; }
.focuscard { grid-template-columns: 0.9rem minmax(0, 1fr) auto auto; }

/* 連線品質診斷 */
.modal.diag { width: min(88rem, 96vw); max-height: 94vh; overflow: auto; }
.dverdict { display: flex; gap: 0.8rem; align-items: flex-start; padding: 0.7rem 1rem; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 0.6rem; }
.dverdict > svg { flex: none; width: 1.8rem; height: 1.8rem; margin-top: 0.1rem; }
.dverdict.crit { border-color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }
.dverdict.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.dverdict.good { border-color: color-mix(in srgb, var(--good) 60%, transparent); background: color-mix(in srgb, var(--good) 8%, transparent); }
.dverdict .vt { font-size: 1.25rem; font-weight: 700; }
.dverdict .vd { font-size: 0.98rem; color: var(--ink-2); line-height: 1.5; margin-top: 0.15rem; }
.dtiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.5rem; margin-bottom: 0.6rem; }
.dtile { border: 1px solid var(--border); border-radius: 10px; padding: 0.4rem 0.7rem; background: var(--surface-2); }
.dtile.crit { border-color: var(--crit); } .dtile.warn { border-color: var(--warn); }
.dtile .dl { font-size: 0.75rem; color: var(--muted); }
.dtile .dv { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.3rem; }
.dtile .dv svg { width: 1.1rem; height: 1.1rem; }
.dtile .ds { font-size: 0.75rem; color: var(--muted); }
.dfindings { display: grid; gap: 0.35rem; margin-bottom: 0.6rem; }
.dfind { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: 0.7rem; align-items: start; padding: 0.4rem 0.7rem; border: 1px solid var(--border); border-radius: 8px; }
.dfind.crit { border-color: var(--crit); background: color-mix(in srgb, var(--crit) 10%, transparent); }
.dfind.warn { border-color: color-mix(in srgb, var(--warn) 70%, transparent); }
.dfind .dlv { font-size: 0.75rem; font-weight: 700; text-align: center; padding: 0.1rem 0.3rem; border-radius: 5px; border: 1px solid currentColor; }
.dfind.crit .dlv { color: var(--crit); } .dfind.warn .dlv { color: var(--warn); } .dfind.info .dlv { color: var(--muted); }
.dfind .ft { font-weight: 700; } .dfind .fd { font-size: 0.88rem; color: var(--ink-2); line-height: 1.45; }
.dcharts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; }
.dblock { border: 1px solid var(--border); border-radius: 10px; padding: 0.5rem 0.7rem; min-width: 0; }
.dblock h3 { margin: 0 0 0.3rem; font-size: 0.88rem; color: var(--ink-2); font-weight: 600; }
.dblock .s, .dun { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
.dun { display: flex; gap: 0.3rem; align-items: center; margin: 0.5rem 0 0; } .dun svg { width: 0.9rem; height: 0.9rem; }
.dspark { width: 100%; height: 6rem; display: block; }
.dspark .dgrid { stroke: rgba(140,170,220,.18); stroke-width: 1; }
.dspark .dline { fill: none; stroke: #4fd1ff; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.dspark .dthr { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 4 3; }
.dspark .dbad { fill: var(--crit); stroke: #fff; stroke-width: .6; }
.dspark .dtx { fill: var(--muted); font-size: 9px; } .dspark .dtx.thr { fill: var(--warn); }
.dbars { display: grid; gap: 0.25rem; }
.dbar { display: grid; grid-template-columns: 5rem minmax(0, 1fr) 3rem; gap: 0.5rem; align-items: center; font-size: 0.85rem; }
.dbar .bt { height: 0.6rem; background: var(--surface-2); border-radius: 4px; overflow: hidden; } .dbar .bf { display: block; height: 100%; background: var(--s1); }
.dbar .bc { text-align: right; color: var(--muted); }
.dblock table.t td { padding: 0.15rem 0.3rem; font-size: 0.85rem; } .dblock table.t tr.hot td { color: var(--crit); font-weight: 700; }
.dkv { display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 0.8rem; font-size: 0.88rem; } .dkv b.bad { color: var(--crit); }
@media (max-width: 1100px) { .dtiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dcharts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
html[data-fit="scroll"] .dtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
html[data-fit="scroll"] .dcharts { grid-template-columns: 1fr; }
html[data-fit="scroll"] .dfind { grid-template-columns: 1fr; }
html[data-fit="scroll"] .frow { grid-template-columns: 1fr; }
html[data-fit="scroll"] .fbody { grid-template-columns: 0.9rem minmax(0, 1fr); } html[data-fit="scroll"] .fbody .fwhere { grid-column: 2; text-align: left; }
html[data-fit="scroll"] .focuscard { grid-template-columns: 0.9rem minmax(0, 1fr); } html[data-fit="scroll"] .focuscard .fdiag { grid-column: 1 / -1; justify-content: center; }

@media (min-width: 1500px) { .dfindings { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
html[data-fit="scroll"] .dfind .dlv { justify-self: start; padding: 0.1rem 0.6rem; }

.dverdict .vconf { margin-left: 0.8rem; font-size: 0.8rem; font-weight: 600; padding: 0.05rem 0.5rem; border: 1px solid currentColor; border-radius: 5px; color: var(--muted); vertical-align: middle; }
.druled { border: 1px solid color-mix(in srgb, var(--good) 45%, transparent); border-radius: 10px; padding: 0.4rem 0.8rem; margin-bottom: 0.6rem; background: color-mix(in srgb, var(--good) 6%, transparent); }
.druled .rt { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.2rem; }
.druled .ri { display: flex; gap: 0.4rem; align-items: center; font-size: 0.9rem; line-height: 1.5; } .druled .ri svg { width: 1rem; height: 1rem; flex: none; }
.dhelp { grid-column: 1 / -1; font-size: 0.78rem; color: var(--muted); }
.dblock td.cat { font-size: 0.75rem; white-space: nowrap; color: var(--muted); } .dblock td.cat.suspicious { color: var(--crit); font-weight: 700; } .dblock td.cat.ambiguous { color: var(--warn); }
.dblock table.t tr.hot td.cat { color: var(--crit); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>網路營運監控</h1>
      <div class="sub" id="subline">連線中…</div>
    </div>
    <div class="topright">
      <div class="riskchip" id="corechip" hidden></div>
      <button type="button" class="riskchip" id="findbtn" hidden></button>
      <button type="button" class="riskchip" id="apchip" hidden></button>
      <button type="button" class="riskchip" id="riskchip" hidden></button>
      <div class="clock"><span id="clock">--:--:--</span><small id="date"></small></div>
    </div>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="main">
    <div class="col left">
      <section class="panel" id="p-lines"></section>
      <section class="panel" id="p-avail"></section>
    </div>
    <div class="col right">
      <section class="panel" id="p-fw"></section>
      <section class="panel" id="p-threat"></section>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
</div>
<div id="tip"></div>

<script src="demo-data.js"></script>
<script src="demo-shim.js"></script>

const AUTO_CLOSE_MS = 60000;   // 自動跳出的 Top N 彈窗,沒人操作 60 秒後自己關閉
const NS = "http://www.w3.org/2000/svg";

/* ── 自動適應任何螢幕比例 ──
   依「寬/高」分成三種版型,每種版型有一個設計尺寸(單位 rem:寬 × 高);
   字級 = 讓設計尺寸剛好塞進視窗(取較吃緊的那一邊)。視窗改變大小、瀏覽器縮放時會自動重算。 */
const FIT = { std: [106.7, 60], ultra: [120, 48], tall: [64, 110] };
const MIN_REM_PX = 9, MAX_REM_PX = 40;
function fitScreen() {
  const w = window.innerWidth, h = window.innerHeight, r = w / h;
  const mode = r < 1 ? "tall" : r >= 2 ? "ultra" : "std";
  const [dw, dh] = FIT[mode];
  const raw = Math.min(w / dw, h / dh);
  const root = document.documentElement;
  // 放不下設計尺寸(手機、很小的視窗)→ 改成單欄捲動,字級依寬度(12~16px),不要縮到看不清楚
  const small = raw < MIN_REM_PX;
  root.style.fontSize = (small ? Math.max(12, Math.min(16, w / 28)) : Math.max(MIN_REM_PX, Math.min(MAX_REM_PX, raw))).toFixed(2) + "px";
  root.dataset.mode = mode;
  root.dataset.fit = raw < MIN_REM_PX ? "scroll" : "fit";
}
fitScreen();
window.addEventListener("resize", fitScreen);

/* ── 小工具:用 DOM 建元素。所有資料都走 textContent,不拼 HTML 字串,避免注入 ── */
function applyProps(n, props) {
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.setAttribute("class", v);
    else if (k === "text") n.textContent = v;
    else if (k === "style" && typeof v === "object") { for (const [sk, sv2] of Object.entries(v)) { sk.startsWith("--") ? n.style.setProperty(sk, sv2) : (n.style[sk] = sv2); } }
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
}
function append(n, kids) {
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
}
const el = (tag, props, ...kids) => { const n = document.createElement(tag); applyProps(n, props); append(n, kids); return n; };
const sv = (tag, props, ...kids) => { const n = document.createElementNS(NS, tag); applyProps(n, props); append(n, kids); return n; };

const ICONS = {
  alert: "M12 3 2 21h20L12 3zm0 6 .01 6M12 18v.01",
  check: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM8 12l3 3 5-6",
  cross: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9 9l6 6M15 9l-6 6",
  info: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 11v6M12 7.5v.01",

function icon(name, color) {
  return sv("svg", { class: "icon", viewBox: "0 0 24 24", fill: "none", stroke: color || "currentColor", "stroke-width": "2",
                     "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" },
            sv("path", { d: ICONS[name] }));
}

const fmt = (n, d = 0) => (n == null || Number.isNaN(n)) ? "-" : Number(n).toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
const pad = n => String(n).padStart(2, "0");
const hhmm = ts => { const d = new Date(ts * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const ageText = s => s < 90 ? `${s} 秒前` : s < 5400 ? `${Math.round(s / 60)} 分鐘前` : `${Math.round(s / 3600)} 小時前`;

/* ── 狀態 ── */
/* 已讀紀錄:使用者看過(點徽章,或手動關閉高風險視窗)的命中,之後不再提示、不再自動彈出。
   存在這台瀏覽器的 localStorage;讀寫失敗(隱私模式等)時只在本次開啟期間有效。 */
function loadAcked() { try { return JSON.parse(localStorage.getItem("noc.risk.acked") || "{}") || {}; } catch (e) { return {}; } }
function saveAcked(o) { try { localStorage.setItem("noc.risk.acked", JSON.stringify(o)); } catch (e) { /* 不能存就算了 */ } }
const state = { acked: loadAcked(), data: null, lastOk: 0, error: null, mapDir: "in", mapView: "globe", mapAnim: !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches), alerted: new Set(), riskAlerted: new Set(), pendingTop: [], modal: null };

/* ── tooltip:一個全域的,靠 data-tip 屬性。也支援鍵盤 focus ── */
const tip = document.getElementById("tip");
function showTip(target, x, y) { showTipText(target.getAttribute("data-tip"), x, y); }
function showTipText(raw, x, y) {
  if (!raw) return;
  tip.replaceChildren();
  const [head, ...rest] = raw.split("\n");
  tip.append(el("b", { text: head }));
  rest.forEach(r => tip.append(el("span", { class: "s", text: r })));
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, window.innerWidth - w - 8) + "px";
  tip.style.top = Math.min(y + 14, window.innerHeight - h - 8) + "px";
}
document.addEventListener("pointermove", e => { const t = e.target.closest && e.target.closest("[data-tip]"); t ? showTip(t, e.clientX, e.clientY) : (tip.style.display = "none"); });
document.addEventListener("focusin", e => { const t = e.target.closest("[data-tip]"); if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.bottom); } });
document.addEventListener("focusout", () => { tip.style.display = "none"; });

/* ── 資料來源共用的「面板標題列」 ── */
function freshness(src) {
  if (!src || !src.available) return el("span", { class: "chip crit" }, icon("cross"), "無資料");
  if (src.stale) return el("span", { class: "chip warn" }, icon("alert"), `資料過期(${ageText(src.age_sec)})`);
  return el("span", { text: `更新 ${ageText(src.age_sec)}` });
}
function panelHead(title, ...tools) { return el("header", null, el("h2", { text: title }), el("div", { class: "tools" }, ...tools)); }
function unavailable(src, name) {
  return el("div", { class: "empty" }, src && src.reason ? src.reason : `目前沒有${name}資料`);
}

/* ── meter:單一色相、細條、圓角資料端;超標改紅色 + 圖示 + 文字(不靠顏色單獨表達) ── */
function meter(pct, color, marks, level) {
  const w = Math.max(0, Math.min(100, Number(pct) || 0));
  const cls = level === "crit" ? " over" : level === "warn" ? " warnf" : (level === true ? " over" : "");
  const m = el("div", { class: "meter", style: { "--mc": color }, role: "img", "aria-label": `${w}%` },
    el("div", { class: "fill" + cls, style: { width: w + "%" } }));
  // marks:門檻刻度線 [{pct, cls, tip}],例如 70%(黃)與 90%(紅)
  (marks || []).forEach(k => m.append(el("div", { class: "thr " + (k.cls || ""), style: { left: k.pct + "%" }, "data-tip": k.tip || `${k.pct}%` })));
  return m;
}

/* ════════ 1. 線路使用率 ════════ */
const F5_IDS = new Set(["5000105", "5000106"]);
/* 線路使用率分級:>= 警示(預設 70%)顯示黃色;>= 嚴重(預設 90%)顯示紅色並自動跳出 Top N。
   門檻值優先用資料裡的 warn_pct / crit_pct(netflow_poll_poc.py 的 WARN_PCT / CRIT_PCT),沒有就用預設。 */
const DEF_WARN = 70, DEF_CRIT = 90;
function lineLevel(l, dir) {
  const u = Number(l[`util_${dir}_pct`]);
  if (!isFinite(u)) return "ok";
  const w = l.warn_pct != null ? l.warn_pct : DEF_WARN, c = l.crit_pct != null ? l.crit_pct : DEF_CRIT;
  return u >= c ? "crit" : u >= w ? "warn" : "ok";
}
function lineMarks(l) {
  const w = l.warn_pct != null ? l.warn_pct : DEF_WARN, c = l.crit_pct != null ? l.crit_pct : DEF_CRIT;
  return [{ pct: w, cls: "w", tip: `警示 ${w}%` }, { pct: c, cls: "c", tip: `嚴重 ${c}%(自動跳出 Top N)` }];
}
function dirCell(l, dir) {
  const util = l[`util_${dir}_pct`], mbps = l[`current_${dir}_mbps`], lv = lineLevel(l, dir);
  const color = dir === "in" ? "var(--s1)" : "var(--s3)";
  const lvText = lv === "crit" ? "嚴重" : lv === "warn" ? "警示" : "正常";
  const tipText = `${l.label} ${dir.toUpperCase()}\n使用率 ${util}%(${fmt(mbps, 1)} Mbps)\n狀態:${lvText}`;
  return el("div", { class: "dir", "data-tip": tipText },
    el("span", { class: "d", text: dir.toUpperCase() }),
    meter(util, color, lineMarks(l), lv),
    el("div", { class: "vbox" },
      el("span", { class: "v" }, lv === "ok" ? null : icon("alert", lv === "crit" ? "var(--crit)" : "var(--warn)"), ` ${util}%`),
      el("span", { class: "mb", text: `${fmt(mbps, 1)} Mbps` })));
}
function lineRow(l) {
  if (l.status === "missing") {
    return el("div", { class: "row", style: { cursor: "default" } }, el("div", null, el("div", { class: "name", text: l.label })),
      el("div", { class: "empty", text: "本次查無資料(介面可能不在監控中)" }), el("div"));
  }
  const li = lineLevel(l, "in"), lo = lineLevel(l, "out");
  const rank = { ok: 0, warn: 1, crit: 2 };
  const worst = rank[li] >= rank[lo] ? li : lo;
  // 上下行頻寬不同時(例如 1G / 600M)兩個都顯示,不然使用率對不起來
  const cap = !l.capacity_in_mbps ? "" : (l.capacity_out_mbps && l.capacity_out_mbps !== l.capacity_in_mbps)
    ? `IN ${fmt(l.capacity_in_mbps)} / OUT ${fmt(l.capacity_out_mbps)} Mbps` : `${fmt(l.capacity_in_mbps)} Mbps`;
  // 點擊時預設看比較吃緊的那個方向
  const dirPick = rank[lo] > rank[li] || (rank[lo] === rank[li] && Number(l.util_out_pct) > Number(l.util_in_pct)) ? "out" : "in";
  return el("button", { class: "row" + (worst === "crit" ? " alert" : worst === "warn" ? " warnrow" : ""), type: "button", "aria-label": `${l.label},點擊查看 Top N`,
                        onclick: () => openTopN(l.id, dirPick) },
    el("div", null,
      el("div", { class: "name" }, worst === "ok" ? null : icon("alert", worst === "crit" ? "var(--crit)" : "var(--warn)"), worst === "ok" ? "" : " ", l.label),
      el("div", { class: "meta", text: `${l.interface || ""} · ${cap}${l.link_up === false ? " · 斷線" : ""}` })),
    dirCell(l, "in"), dirCell(l, "out"));
}
function renderLines() {
  const p = document.getElementById("p-lines"); const src = state.data.netflow;
  p.replaceChildren();
  const legend = el("span", { class: "key" }, el("i", { style: { background: "var(--s1)" } }), "IN 下載 ",
    el("i", { style: { background: "var(--s3)", marginLeft: "0.5rem" } }), "OUT 上傳");
  p.append(panelHead("線路使用率", legend, freshness(src)));
  const body = el("div", { class: "body" }); p.append(body);
  if (!src.available) { body.append(unavailable(src, "線路")); return; }
  const lines = src.data.lines || [];
  // F5 內網端口只用來在背景推算 NAT 前的內部 IP,不放在畫面上
  const shown = lines.filter(l => !F5_IDS.has(String(l.id)));
  body.append(el("div", { class: "lines" }, shown.map(lineRow)));
  const w0 = shown[0] && shown[0].warn_pct != null ? shown[0].warn_pct : DEF_WARN, c0 = shown[0] && shown[0].crit_pct != null ? shown[0].crit_pct : DEF_CRIT;
  body.append(el("div", { class: "foot", text: `使用率 ≥ ${w0}% 顯示黃色警示;≥ ${c0}% 變紅並自動跳出 Top N。點任一線路可查看 Top N 連線。` }));
}

}
function renderFw() {

}

/* ════════ 3. 核心設備存活率 ════════ */

/* ════════ Meraki 大樓無線 AP(健康度燈號 + 樓層平面圖彈窗) ════════
   資料來源:/api/summary 裡的 meraki(meraki_poll.py 每分鐘更新)。沒有這份資料(沒設 Meraki 金鑰)時,
   這整塊不啟用,左下角維持原本的「核心設備存活率」表格。 */
const AP_COLOR = { good: "var(--good)", warn: "var(--warn)", crit: "var(--crit)", off: "var(--muted)" };
const AP_TEXT = { good: "正常", warn: "警告", crit: "離線", off: "休眠/未知" };
const AP_RANK = { crit: 3, warn: 2, good: 1, off: 0 };
const FAIL_NAME = { assoc: "關聯", auth: "驗證", dhcp: "DHCP", dns: "DNS" };
const apLevel = a => a.status === "online" ? "good" : a.status === "alerting" ? "warn" : a.status === "offline" ? "crit" : "off";
const apKey = a => `${a.serial}|${a.status}`;
function loadApAcked() { try { return JSON.parse(localStorage.getItem("noc.ap.acked") || "{}") || {}; } catch (e) { return {}; } }
function saveApAcked(o) { try { localStorage.setItem("noc.ap.acked", JSON.stringify(o)); } catch (e) { /* 不能存就算了 */ } }
state.apAcked = loadApAcked(); state.apAlerted = new Set(); state.apNames = false; state.apOrig = false;

const merakiSrc = () => state.data && state.data.meraki;
const merakiOn = () => { const s = merakiSrc(); return !!(s && s.available && s.data && Array.isArray(s.data.floors) && s.data.floors.length); };
const merakiFresh = () => merakiOn() && !merakiSrc().stale && merakiSrc().data.status === "ok";
const floorLevel = f => { let w = "off"; for (const a of f.aps) { const l = apLevel(a); if (AP_RANK[l] > AP_RANK[w]) w = l; } return w; };
function badAps(d) {
  const out = [];
  for (const f of d.floors) for (const a of f.aps) { const l = apLevel(a); if (l === "crit" || l === "warn") out.push({ ap: a, floor: f, level: l }); }
  return out.sort((x, y) => AP_RANK[y.level] - AP_RANK[x.level] || y.floor.rank - x.floor.rank);
}
const sinceText = a => {
  const t = (a.alerts || []).map(x => Date.parse(x.since)).filter(x => isFinite(x)).sort((p, q) => p - q)[0];
  return t ? ageText(Math.max(0, Math.round((Date.now() - t) / 1000))) : "";
};
function failReason(a) {
  const f = a.fail; if (!f || !a.attempts) return "";
  const top = Object.entries(f).sort((p, q) => q[1] - p[1])[0];
  return top && top[1] > 0 ? `主因:${FAIL_NAME[top[0]] || top[0]}` : "";
}
function apDetail(a, f) {
  const lines = [`${a.name}(${f.label})`, `狀態:${AP_TEXT[apLevel(a)]}${a.status === "offline" && sinceText(a) ? `,已 ${sinceText(a)}` : ""}`,
    `連線用戶:${a.clients == null ? "--" : a.clients}`];
  if (a.attempts) lines.push(`近 2 小時連線(參考):嘗試 ${a.attempts} 次,成功 ${a.success_pct == null ? "--" : a.success_pct + "%"}${failReason(a) ? "(" + failReason(a) + ")" : ""}`);
  (a.alerts || []).slice(0, 2).forEach(x => lines.push(`告警:${x.title || "-"}`));
  return lines.join("\n");
}

/* 狀態圖形:圓 = 正常、三角 = 警告、菱形 = 離線、空心圓 = 休眠(不只靠顏色分辨) */
function apGlyph(level, scale) {
  const g = sv("g", { transform: scale ? `scale(${scale})` : null });
  g.append(level === "good" ? sv("circle", { r: 6.5, fill: AP_COLOR.good })
    : level === "warn" ? sv("path", { d: "M0 -8 L8 6.5 L-8 6.5Z", fill: AP_COLOR.warn })
    : level === "crit" ? sv("path", { d: "M0 -9.5 L9.5 0 L0 9.5 L-9.5 0Z", fill: AP_COLOR.crit })
    : sv("circle", { r: 5.5, fill: "none", stroke: AP_COLOR.off, "stroke-width": 2.4 }));
  return g;
}
const apIcon = (level, size) => sv("svg", { viewBox: "-10 -10 20 20", class: "apicon", style: size ? { width: size, height: size } : null, "aria-hidden": "true" }, apGlyph(level));

function dotLevels(aps, max) {          // 樓層圖裡每層最多畫 max 顆小燈;太多時保留所有異常的,其餘等距抽樣
  const s = aps.slice().sort((a, b) => (a.u == null ? 0 : a.u) - (b.u == null ? 0 : b.u)).map(apLevel);
  if (s.length <= max) return s;

async function doFind(q) {
  const st = state.modal; if (!st || st.kind !== "find") return;
  if (q.length < 3) { st.res = null; st.busy = false; paintFind(); return; }
  const seq = ++st.seq; st.busy = true; paintFind();
  let out;
  try {
    const res = await fetch("/api/meraki_find?q=" + encodeURIComponent(q), { cache: "no-store", referrerPolicy: "no-referrer" });
    let j = {}; try { j = await res.json(); } catch (e) { /* 不是 JSON 就用狀態碼 */ }
    out = (!res.ok || j.error) ? { error: (j.error && j.error.message) || `HTTP ${res.status}${res.status === 404 ? "(伺服器還不是新版)" : ""}` } : { q, total: j.total, results: j.results || [], hours: j.window_hours };
  } catch (e) { out = { error: e.message || "連線失敗" }; }
  if (state.modal !== st || seq !== st.seq) return;      // 視窗已關閉、或已經輸入了新的字:丟掉這次結果
  st.busy = false; st.res = out; paintFind();
}

function paintFind() {
  const st = state.modal; if (!st || st.kind !== "find" || !st.box) return;
  const box = st.box, r = st.res; box.replaceChildren();
  if (st.busy) { box.append(el("div", { class: "empty", text: "搜尋中…(第一次搜尋要向 Meraki 取清單,可能需要幾秒)" })); return; }
  if (!r) { box.append(el("div", { class: "empty", text: "輸入至少 3 個字,按 Enter 或稍等一下就會搜尋。" })); return; }
  if (r.error) { box.append(el("div", { class: "empty" }, icon("alert", "var(--warn)"), ` ${r.error}`)); return; }
  if (!r.results.length) { box.append(el("div", { class: "empty", text: `找不到符合的裝置。只能找到最近 ${r.hours || 24} 小時內有連線紀錄的裝置。` })); return; }
  if (r.total > r.results.length) box.append(el("div", { class: "foot", text: `共 ${r.total} 筆,只顯示前 ${r.results.length} 筆,請輸入更完整的關鍵字縮小範圍。` }));
  r.results.forEach(x => {
    const loc = findLocate(x), who = x.user || x.name || x.mac;
    const sub = [x.user && x.name ? x.name : "", x.mac, x.ip, x.ssid].filter(Boolean).join(" · ");
    const where = x.wired ? "有線連線(非無線 AP)" : loc ? `${loc.f.label} · ${loc.a.short}` : x.ap_name ? `${x.ap_name}(不在大樓樓層圖上)` : "找不到所在的 AP";
    const state_ = x.online ? "在線" : (x.last_seen ? `離線,最後出現 ${lastSeenText(x.last_seen)}` : "離線");
    const body = [
      el("span", { class: "fdot " + (x.online ? "on" : "off"), "aria-hidden": "true" }),
      el("div", { class: "fmain" }, el("div", { class: "n", text: who }), el("div", { class: "s", text: sub })),
      el("div", { class: "fwhere" }, el("div", { class: "n", text: where }), el("div", { class: "s", text: state_ }))];
    const back = { q: st.q, res: st.res };
    const main = loc
      ? el("button", { type: "button", class: "fbody link", "aria-label": `${who},${where},點擊查看平面圖`,       // 可點:跳到該樓層平面圖並標出這顆 AP
          onclick: () => openMerakiModal(loc.f.name, false, { serial: loc.a.serial, who, mac: x.mac, ip: x.ip, ssid: x.ssid, online: x.online, last_seen: x.last_seen, back }) }, ...body)
      : el("div", { class: "fbody" }, ...body);
    const diag = x.wired ? null : el("button", { type: "button", class: "fdiag", "aria-label": `診斷 ${who} 的無線連線品質`, "data-tip": "查看這位用戶最近的訊號、漫遊、延遲與斷線,判斷掉包原因",
      onclick: () => openDiag({ mac: x.mac, who, ip: x.ip, ssid: x.ssid, ap_serial: x.ap_serial, ap_name: x.ap_name, online: x.online, last_seen: x.last_seen }, 2, back) }, icon("alert", "currentColor"), "診斷");

}

/* 趨勢小圖:資料斷掉的地方不連線;低於(或高於)門檻的點用實心方塊標出,不只靠顏色 */
function diagSpark(points, key, o) {
  const W = 320, H = 96, PL = 30, PR = 6, PT = 8, PB = 16;
  const pts = (points || []).filter(p => p.t != null);
  const svg = sv("svg", { class: "dspark", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": o.label, preserveAspectRatio: "none" });
  const vals = pts.map(p => p[key]).filter(v => v != null);
  if (!vals.length) { svg.append(sv("text", { x: W / 2, y: H / 2, "text-anchor": "middle", class: "dtx", text: "這段時間沒有資料" })); return svg; }
  const lo = o.min != null ? o.min : Math.min(...vals), hi = Math.max(o.max != null ? o.max : -Infinity, ...vals) * (o.pad || 1);
  const t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 1);
  const X = t => PL + (t - t0) / (t1 - t0) * (W - PL - PR), Y = v => PT + (1 - (Math.min(Math.max(v, lo), hi) - lo) / ((hi - lo) || 1)) * (H - PT - PB);
  [lo, (lo + hi) / 2, hi].forEach(v => {
    svg.append(sv("line", { x1: PL, x2: W - PR, y1: Y(v), y2: Y(v), class: "dgrid" }));
    svg.append(sv("text", { x: PL - 3, y: Y(v) + 3, "text-anchor": "end", class: "dtx", text: String(Math.round(v)) }));
  });
  if (o.thr != null) {
    svg.append(sv("line", { x1: PL, x2: W - PR, y1: Y(o.thr), y2: Y(o.thr), class: "dthr" }));
    svg.append(sv("text", { x: W - PR, y: Y(o.thr) - 2, "text-anchor": "end", class: "dtx thr", text: o.thrText || "" }));
  }
  let d = "", open = false;
  pts.forEach(p => { const v = p[key]; if (v == null) { open = false; return; } d += `${open ? "L" : "M"}${X(p.t).toFixed(1)},${Y(v).toFixed(1)}`; open = true; });
  svg.append(sv("path", { d, class: "dline" }));
  pts.forEach(p => {
    const v = p[key]; if (v == null) return;
    const bad = o.below ? v < o.thr : v >= o.thr;
    if (o.thr != null && bad) svg.append(sv("rect", { x: X(p.t) - 2.5, y: Y(v) - 2.5, width: 5, height: 5, class: "dbad" }));
  });
  const tf = t => new Date(t * 1000).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
  svg.append(sv("text", { x: PL, y: H - 3, class: "dtx", text: tf(t0) }), sv("text", { x: W - PR, y: H - 3, "text-anchor": "end", class: "dtx", text: tf(t1) }));
  return svg;
}

  const dirName = { in: "IN 來源", out: "OUT 目的地", total: "合計" }[dir];
  const sorted = rows.filter(r => valueOf(r, dir) > 0).sort((a, b) => valueOf(b, dir) - valueOf(a, dir));
  const total = sorted.reduce((s, r) => s + valueOf(r, dir), 0) || 1;

  // 右側排名(地球與平面地圖共用):每列可點,點了地球會轉到該國家
  const buildRank = (n, clickable) => {
    const rank = el("div", { class: "rank" + (clickable ? " single" : "") + (dir === "out" ? " out" : "") });
    const top = sorted.slice(0, n); const max = top.length ? valueOf(top[0], dir) : 1;
    top.forEach(r => {
      const v = valueOf(r, dir), tags = tagsFor(r);
      const kids = [el("span", { class: "cn", text: cname(r.iso) }),
        el("div", { class: "rbar" }, el("div", { style: { width: `${v / max * 100}%` } })),
        el("span", { class: "val", text: `${fmt(v, 1)} GB` }),
        tags.length ? el("div", { class: "tags" }, tags) : null];
      rank.append(clickable
        ? el("button", { class: "item", type: "button", "data-iso": r.iso, "data-tip": tipFor(r), onclick: () => globeInstance && globeInstance.focusIso(r.iso, true) }, ...kids)
        : el("div", { class: "item", "data-tip": tipFor(r), tabindex: 0 }, ...kids));
    });
    return rank;
  };

  if (state.mapView === "table") {
    const t = el("table", { class: "t" }, el("thead", null, el("tr", null,
      ["國家", "IN (GB)", "OUT (GB)", "佔比", "標示", "主要 IP [所屬單位]"].map((h, i) => el("th", { class: i >= 1 && i <= 3 ? "r" : "", text: h })))));
    const tb = el("tbody");
    sorted.forEach(r => tb.append(el("tr", null,
      el("td", { text: `${cname(r.iso)} (${r.iso})` }), el("td", { class: "r", text: fmt(r.in, 2) }), el("td", { class: "r", text: fmt(r.out, 2) }),
      el("td", { class: "r", text: `${fmt(valueOf(r, dir) / total * 100, 1)}%` }),
      el("td", null, el("div", { style: { display: "flex", gap: "0.3rem", flexWrap: "wrap" } }, tagsFor(r))),
      el("td", { text: r.topIps.map(i => `${i.ip}${i.org ? " [" + i.org + "]" : ""}`).join(";") }))));
    t.append(tb);
    body.append(el("div", { class: "scroll" }, t));
  } else if (state.mapView === "globe" && window.d3geo) {
    const items = sorted.filter(r => MAPDATA.countries[r.iso]).map(r => ({
      iso: r.iso, lat: MAPDATA.countries[r.iso].lat, lon: MAPDATA.countries[r.iso].lon, v: valueOf(r, dir), row: r,
      flag: r.high_risk ? "crit" : (r.unexpected && !r.cdn) ? "warn" : null }));
    if (!globeInstance) globeInstance = new Globe();
    const stage = el("div", { class: "gstage" });
    const note = el("div", { class: "gnote", text: dir === "out" ? "白圈 = 台灣(本地);弧線上的點:台灣 → 目的地" : dir === "in" ? "白圈 = 台灣(本地);弧線上的點:來源 → 台灣" : "白圈 = 台灣(本地);顏色越亮、泡泡越大 = 流量越多" });
    const cap = el("div", { class: "gcap", "aria-live": "off" });
    const zoomBtn = el("button", { class: "chip accent zoombtn", type: "button", onclick: () => openMapModal(), text: "⤢ 放大地圖(點地球也可以)" });
    const rank = buildRank(7, true);
    const updateCaption = it => {
      if (!it) return;
      cap.textContent = `${cname(it.iso)} · ${dirName} ${fmt(it.v, 1)} GB(${fmt(it.v / total * 100, 1)}%)`;
      rank.querySelectorAll(".item").forEach(n => n.classList.toggle("focus", n.getAttribute("data-iso") === it.iso));
    };
    globeInstance.onFocus = updateCaption;
    globeInstance.onClick = () => openMapModal();
    globeInstance.onHover = (it, x, y) => { if (!it) { tip.style.display = "none"; return; }
      showTipText(it.home ? "台灣(本地)\n連線的終點/起點" : tipFor(it.row), x, y); };
    body.append(el("div", { class: "threat globe" }, el("div", { class: "globebox" }, el("div", { class: "gtop" }, note, zoomBtn), stage, cap), rank));
    globeInstance.attach(stage);
    globeInstance.setData(items, dir);
    updateCaption(globeInstance.items[globeInstance.tourIdx]);
  } else {
    body.append(el("div", { class: "threat" }, el("div", { class: "mapbox" }, drawMap(rows, dir)), buildRank(6, false)));
  }
  body.append(el("div", { class: "foot" },
    `統計範圍:各 WAN 線路、各方向的 Top 連線的外部公網 IP,不含小流量連線;國別依 IP 註冊地,CDN/雲端(任播)的國別僅供參考。 `,
    "IP Geolocation by ", el("a", { href: "https://db-ip.com", target: "_blank", rel: "noopener", text: "DB-IP" })));
}

/* ════════ Top N 彈窗 ════════ */
let modalToken = 0, autoTimer = null;
const overlay = document.getElementById("overlay"), modal = document.getElementById("modal");
function clearAuto() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } }
const MAP_AUTO_CLOSE_MS = 120000;   // 地圖彈窗:沒人操作 2 分鐘自動關閉(每次操作會重新計時)
function touchAuto() {
  clearAuto();
  if (!state.modal || overlay.hidden) return;
  const k = state.modal.kind;
  // 搜尋視窗、診斷視窗與「從搜尋點進來的平面圖」閒置 1 分鐘就自動關閉(避免個人資料一直留在大螢幕上);其他彈窗 2 分鐘
  const ms = (k === "find" || k === "diag" || (k === "ap" && state.modal.focus)) ? FIND_IDLE_MS : (k === "map" || k === "risk" || k === "ap") ? MAP_AUTO_CLOSE_MS : 0;
  if (ms) autoTimer = setTimeout(() => closeModal({ auto: true }), ms);
}
// 手動關閉高風險視窗 = 看過了(已讀);逾時自動關閉(傳入 {auto:true})不算,徽章會繼續提醒
function closeModal(arg) {
  const byAuto = !!(arg && arg.auto === true);
  const wasRisk = !!(state.modal && state.modal.kind === "risk"), wasAp = !!(state.modal && state.modal.kind === "ap" && !state.modal.focus);
  clearAuto(); overlay.hidden = true; state.modal = null; modalToken++; modal.replaceChildren();
  if (wasRisk && !byAuto) ackRisk();
  if (wasAp && !byAuto) ackAp();
}
overlay.addEventListener("pointerdown", e => { touchAuto(); if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => { touchAuto(); if (e.key === "Escape" && !overlay.hidden) closeModal(); });

async function openTopN(lineId, dir, auto = false) {
  clearAuto();
  const line = ((state.data && state.data.netflow.available && state.data.netflow.data.lines) || []).find(l => String(l.id) === String(lineId));
  const label = line ? line.label : lineId;
  const isAlert = !!(line && lineLevel(line, dir) === "crit");
  const token = ++modalToken;
  state.modal = { lineId, dir };
  const bodyBox = el("div", { class: "scroll", style: { minHeight: "8rem" } }, el("div", { class: "empty", text: "查詢中…(NetFlow Analyzer 可能需要數秒)" }));
  const meta = el("div", { class: "meta", text: "" });
  const tabs = el("div", { class: "seg" }, [["in", "IN 下載"], ["out", "OUT 上傳"]].map(([k, t]) =>
    el("button", { type: "button", "aria-pressed": String(dir === k), onclick: () => openTopN(lineId, k), text: t })));
  modal.className = "modal" + (isAlert ? " alert" : "");
  modal.replaceChildren(
    el("header", null,
      el("h2", { id: "modal-title" }, isAlert ? icon("alert", "var(--crit)") : null, `${label} · Top N 連線`,
        isAlert ? el("span", { class: "chip crit", text: `${dir.toUpperCase()} 超過 ${line && line.crit_pct != null ? line.crit_pct : DEF_CRIT}%` }) : null),
      el("div", { style: { display: "flex", gap: "0.8rem", alignItems: "center" } }, tabs,
        el("button", { class: "xbtn", type: "button", "aria-label": "關閉", onclick: closeModal, text: "關閉 ✕" }))),
    meta, bodyBox,
    el("div", { class: "note", text: "若這條線路經過 NAT:IN 方向的「目的 IP」、OUT 方向的「來源 IP」是 NAT 後的公網 IP。標示「↳ 內部(推算)」的是依外部對象 IP 與流量大小,從 NAT 前的觀察點配對出的內部主機,不是精確對應(可信度低的請對照 NAT 設備連線紀錄確認)。" }));
  overlay.hidden = false;
  modal.querySelector(".xbtn").focus();
  if (auto) autoTimer = setTimeout(() => closeModal({ auto: true }), AUTO_CLOSE_MS);

  try {
    const res = await fetch(`/api/topn?line=${encodeURIComponent(lineId)}&dir=${dir}&rows=10`, { cache: "no-store" });
    const j = await res.json();
    if (token !== modalToken) return;   // 使用者已切換到別的分頁,丟掉這次結果
    if (j.error) { bodyBox.replaceChildren(el("div", { class: "empty" }, icon("alert", "var(--warn)"), ` ${j.error.message || "查詢失敗"}`)); return; }
    meta.textContent = `統計時段:${j.time_range || "-"}(NetFlow Analyzer 最細以小時彙總,沒有單筆連線的精確時間)`;
    const recs = j.records || [];
    const maxPct = Math.max(1, ...recs.map(r => r.pct));
    const t = el("table", { class: "t" }, el("thead", null, el("tr", null,
      ["來源 IP", "目的 IP", "服務(Port/協定)", "流量", "佔比"].map((h, i) => el("th", { class: i >= 3 ? "r" : "", text: h })))));
    const tb = el("tbody");
    // NAT 端 = IN 方向的「目的 IP」、OUT 方向的「來源 IP」;推算出的內部 IP 顯示在它下面
    const natLine = n => {
      if (!n) return null;
      const cc = { "高": "good", "中": "accent", "低": "warn" }[n.confidence];
      if (!n.ip) return el("div", { class: "natline none", "data-tip": n.reason || "" }, "↳ 內部 IP:", n.confidence || "未推算");
      const tip = (n.candidates || []).map(c => `${c.ip}(流量相近度 ${Math.round(c.similarity * 100)}%)`).join("\n");
      return el("div", { class: "natline", "data-tip": `候選內部 IP(依相近度排序)\n${tip}` },
        "↳ 內部(推算)", el("span", { class: "nip", text: n.ip }), el("span", { class: "chip " + (cc || ""), text: `可信度 ${n.confidence}` }));
    };
    const ipCell = (ip, nat) => el("td", null, el("div", { text: ip }), natLine(nat));
    recs.forEach(r => tb.append(el("tr", null,
      ipCell(r.src, dir === "out" ? r.nat : null), ipCell(r.dst, dir === "in" ? r.nat : null),
      el("td", { text: `${r.app || "-"} (${r.port || "-"}/${r.protocol || "-"})` }),
      el("td", { class: "r", text: r.traffic }),
      el("td", { class: "r" }, `${fmt(r.pct, 2)}%`, el("span", { class: "pbar", style: { width: `${r.pct / maxPct * 3.5}rem` } })))));
    t.append(tb);
    const natMsg = j.nat && j.nat.status === "error" ? el("div", { class: "empty", style: { padding: "0.3rem 0" } }, icon("alert", "var(--warn)"), ` 內部 IP 推算失敗(Top N 本身不受影響):${j.nat.message || ""}`)
      : (j.nat && j.nat.status === "ok" ? el("div", { class: "meta", style: { margin: "0 0 0.4rem" }, text: `內部 IP 為推算:以「${(j.nat.inside || []).join("、")}」的連線資料配對(資料約 ${j.nat.inside_age_sec || 0} 秒前)` }) : null);
    bodyBox.replaceChildren(...(recs.length ? [natMsg, t] : [el("div", { class: "empty", text: "這個時段沒有連線紀錄。" })]).filter(Boolean));
  } catch (err) {
    if (token === modalToken) bodyBox.replaceChildren(el("div", { class: "empty" }, icon("alert", "var(--warn)"), ` 無法取得 Top N:${err.message}`));
  }
}

/* ════════ 地球點擊 → 平面連線地圖彈窗 ════════ */
// 流量由低到高 4 級的顏色(藍→青→琥珀→橘紅),同時用線條粗細區分,不只靠顏色
const TIERS = [
  { color: "#4a90e2", width: 1.4, dot: 3.2, name: "低" },
  { color: "#2ec4d6", width: 2.2, dot: 4.2, name: "中低" },
  { color: "#fab219", width: 3.2, dot: 5.4, name: "中高" },
  { color: "#f0653f", width: 4.6, dot: 7.0, name: "高" },
];
const TIER_CUTS = [0.03, 0.15, 0.5];   // 相對「最高的外國」流量的比例
const tierOf = (v, max) => { const r = max > 0 ? v / max : 0; return r >= TIER_CUTS[2] ? 3 : r >= TIER_CUTS[1] ? 2 : r >= TIER_CUTS[0] ? 1 : 0; };
const fmtGB = v => v >= 100 ? fmt(v, 0) : v >= 10 ? fmt(v, 1) : fmt(v, 2);

function safeModal(fn) {
  try { fn(); }
  catch (err) { console.error("modal", err); modal.replaceChildren(el("div", { class: "empty" }, icon("alert", "var(--warn)"), ` 地圖顯示失敗:${err.message}`),
    el("button", { class: "xbtn", type: "button", onclick: closeModal, text: "關閉 ✕" })); }
}

let flatCache = null;   // 投影與國家輪廓只算一次
function flatBase() {
  if (flatCache) return flatCache;
  const g = window.d3geo, W = 1000, H = 500;
  // 以經度 150° 為中心:太平洋不會被切開(台灣與美洲之間的弧線完整),被切開的是大西洋
  const proj = g.geoEquirectangular().rotate([-150, 0]).scale(W / (2 * Math.PI)).translate([W / 2, H / 2]);
  const gp = g.geoPath(proj);
  const countries = GLOBE.map(([iso, coords]) => ({ iso, d: gp({ type: "MultiPolygon", coordinates: coords }) })).filter(c => c.d);
  flatCache = { g, W, H, proj, gp, countries, sphere: gp({ type: "Sphere" }), grat: gp(g.geoGraticule10()) };
  return flatCache;
}

function flatArcMap(sorted, dir, anim, intro) {
  const { g, W, proj, gp, countries, sphere, grat } = flatBase();
  const Y0 = 28, VH = 388;   // 只取緯度約 +85° ~ -60°(南極洲沒有流量,省空間)
  const svg = sv("svg", { viewBox: `0 ${Y0} ${W} ${VH}`, role: "img", "aria-label": "各國連到台灣的連線地圖,顏色代表流量高低", style: { width: "100%", height: "auto", display: "block" } });
  if (!anim) svg.classList.add("noanim");
  svg.append(sv("path", { d: sphere, fill: "#090a0c" }), sv("path", { d: grat, fill: "none", stroke: "var(--grid)", "stroke-width": 0.5 }));

  const foreign = sorted.filter(r => r.iso !== HOME.iso && MAPDATA.countries[r.iso]);
  const max = foreign.length ? valueOf(foreign[0], dir) : 1;
  const tierByIso = new Map(foreign.map(r => [r.iso, tierOf(valueOf(r, dir), max)]));

  // 國家底色:有連線的國家依級別淡淡上色
  const land = sv("g");
  for (const c of countries) {
    const t = tierByIso.get(c.iso);
    land.append(sv("path", { d: c.d, fill: t == null ? (c.iso === HOME.iso ? "#4a4d55" : "#2b2d31") : TIERS[t].color, "fill-opacity": t == null ? 1 : 0.38, stroke: "#4f5157", "stroke-width": 0.5 }));
  }
  svg.append(land);

  // 連線弧線:低級先畫、高級後畫(高流量在最上面)
  // 動畫(都只是裝飾,數字與顏色才是資訊):
  //  1. 開啟時弧線由台灣/來源端「描繪」出來(只在剛打開時一次,資料更新時不重播)
  //  2. 弧線上有細虛線持續流動,方向 = 流量方向(IN 朝台灣、OUT 離開台灣),流量越高流得越快
  //  3. 流量越高的國家,弧線上跑的光點越多、越快
  const home = [HOME.lon, HOME.lat];
  const asc = [...foreign].reverse();
  const arcs = sv("g", { fill: "none", "stroke-linecap": "round" });
  const PACKETS = [1, 1, 2, 3], PKT_SEC = [11, 8.5, 6.5, 5], FLOW_SEC = [2.6, 2.1, 1.7, 1.3];
  asc.forEach((r, i) => {
    const c = MAPDATA.countries[r.iso], t = tierByIso.get(r.iso), T = TIERS[t];
    const interp = g.geoInterpolate([c.lon, c.lat], home), pts = [];
    for (let k = 0; k <= 64; k++) pts.push(interp(k / 64));
    const d = gp({ type: "LineString", coordinates: pts });
    if (!d) return;
    const grp = sv("g", { class: "arcg", "data-iso": r.iso });
    // 底線(實線,顏色 = 流量級別)
    grp.append(sv("path", { class: "arc" + (anim && intro ? " intro" : ""), d, pathLength: 1, stroke: T.color, "stroke-width": T.width, "stroke-opacity": 0.85,
      style: { "--d": `${0.15 + i * 0.12}s` } }));
    if (anim) {
      const rev = dir === "out";   // OUT:台灣 -> 目的地,方向反過來
      const fdel = `${1.4 + i * 0.1}s`;   // 進場時,等弧線描繪完才開始流動
      grp.append(sv("path", { class: "flow" + (rev ? " rev" : "") + (intro ? " fintro" : ""), d, stroke: "#fff", "stroke-width": Math.max(1, T.width * 0.4), "stroke-opacity": 0.6,
        style: { "--fd": `${FLOW_SEC[t]}s`, "--fdel": fdel } }));
      const n = PACKETS[t];
      for (let k = 0; k < n; k++) {
        const backward = dir === "out" || (dir === "total" && k % 2 === 1);   // 合計:一半光點反向
        const pk = sv("g", { class: "packet" + (intro ? " pfade" : ""), style: { "--fdel": fdel } });
        pk.append(sv("circle", { r: T.width + 3.2, fill: T.color, "fill-opacity": 0.28 }), sv("circle", { r: Math.max(1.8, T.width * 0.7), fill: "#fff" }));
        const am = sv("animateMotion", { dur: `${PKT_SEC[t]}s`, repeatCount: "indefinite", path: d, calcMode: "linear",
          begin: `${-(PKT_SEC[t] * (k / n + ((i * 0.37) % 1) / n)).toFixed(2)}s` });
        if (backward) { am.setAttribute("keyPoints", "1;0"); am.setAttribute("keyTimes", "0;1"); }
        pk.append(am); grp.append(pk);
      }
    }
    arcs.append(grp);
  });
  svg.append(arcs);

  // 端點 + 標籤(最多標 10 個,挑不重疊的位置)
  const boxes = [], hit = (a, b) => !(a.x2 < b.x1 || a.x1 > b.x2 || a.y2 < b.y1 || a.y1 > b.y2);
  const dots = sv("g"), labels = sv("g"), pos = [];
  asc.forEach(r => {
    const c = MAPDATA.countries[r.iso], p = proj([c.lon, c.lat]); if (!p) return;
    const t = tierByIso.get(r.iso), rad = TIERS[t].dot;
    const flag = r.high_risk ? "var(--crit)" : (r.unexpected && !r.cdn) ? "var(--warn)" : null;
    const node = sv("g", { tabindex: 0, "data-iso": r.iso, "data-tip": `${tipFor(r)}\n流量級別:${TIERS[t].name}`, "aria-label": `${cname(r.iso)} ${fmtGB(valueOf(r, dir))} GB` });
    if (anim && t >= 2) for (let k = 0; k < 2; k++)   // 流量高的國家:向外擴散的波紋
      node.append(sv("circle", { class: "ripple", cx: p[0], cy: p[1], r: rad + 2, fill: "none", stroke: TIERS[t].color, "stroke-width": 1.6, style: { animationDelay: `${k * 1.2 + (pos.length % 5) * 0.3}s` } }));
    node.append(sv("circle", { cx: p[0], cy: p[1], r: rad + 9, fill: "transparent" }));
    if (flag) node.append(sv("circle", { cx: p[0], cy: p[1], r: rad + 3.5, fill: "none", stroke: flag, "stroke-width": 1.8 }));
    node.append(sv("circle", { class: anim && intro ? "dotpop" : "", cx: p[0], cy: p[1], r: rad, fill: TIERS[t].color, stroke: "var(--surface)", "stroke-width": 1.6, style: { "--d": `${0.9 + pos.length * 0.1}s` } }));
    dots.append(node);
    boxes.push({ x1: p[0] - rad, y1: p[1] - rad, x2: p[0] + rad, y2: p[1] + rad });
    pos.push({ r, p, rad });
  });
  const hp = proj(home);
  if (hp) {
    boxes.push({ x1: hp[0] - 9, y1: hp[1] - 9, x2: hp[0] + 9, y2: hp[1] + 9 });
    const homeG = sv("g", { "data-tip": "台灣(本地)\n連線的終點/起點" });
    if (anim) for (let k = 0; k < 2; k++) homeG.append(sv("circle", { class: "ripple home", cx: hp[0], cy: hp[1], r: 8, fill: "none", stroke: "#fff", "stroke-width": 1.6, style: { animationDelay: `${k * 1.2}s` } }));
    homeG.append(sv("circle", { cx: hp[0], cy: hp[1], r: 8, fill: "none", stroke: "#fff", "stroke-width": 2.2 }), sv("circle", { cx: hp[0], cy: hp[1], r: 2.6, fill: "#fff" }));
    dots.append(homeG);
  }
  const place = (text, x, y, rad, bold) => {
    const tw = text.length * 14 + 6, th = 15;
    const cands = [[rad + 6, 5], [-(rad + 6) - tw, 5], [-tw / 2, -(rad + 7)], [-tw / 2, rad + 17], [rad + 6, -rad], [-(rad + 6) - tw, -rad], [rad + 6, rad + 13], [-(rad + 6) - tw, rad + 13]];
    for (const [dx, dy] of cands) {
      const box = { x1: x + dx, y1: y + dy - th, x2: x + dx + tw, y2: y + dy + 3 };

/* ════════ 總覽狀態 + 自動彈窗 ════════ */
function summarize() {

    if (!d[k].available) { incomplete = true; issues.push({ sev: "warn", text: `${name}沒有資料` }); }
    else if (d[k].stale) { incomplete = true; issues.push({ sev: "warn", text: `${name}資料過期` }); }

    else if (lv === "warn") issues.push({ sev: "warn", text: `${l.label} ${dir.toUpperCase()} 使用率偏高` });
  }
