    for (const f of (d.firewall.data.firewalls || [])) (f.alerts || []).forEach(a => issues.push({ sev: "crit", text: `${f.label}:${a}` }));
  }
  if (merakiFresh()) for (const x of badAps(merakiSrc().data)) issues.push({ sev: x.level, text: `${x.floor.label} ${x.ap.short} ${x.level === "crit" ? "離線" : "警告"}` });
  for (const h of riskHits()) issues.push({ sev: "crit", text: `高風險連線:${h.peer_ip}(${h.entry})` });
  if (fresh("threat_map")) for (const r of combineCountries(d.threat_map.data)) {
    if (r.high_risk) issues.push({ sev: "crit", text: `高風險地區流量:${cname(r.iso)}` });
    else if (r.unexpected && !r.cdn) issues.push({ sev: "warn", text: `非預期國家流量:${cname(r.iso)}` });
  }
  return { issues, overKeys, incomplete };
}
function renderOverall() {
  const { issues, overKeys, incomplete } = summarize();
  // 提醒橫幅(由上而下的優先順序):資料伺服器連線問題 > 高風險偵測本身異常。
  // 高風險「命中」不放橫幅(會越積越多),改成右上角的徽章,看過(已讀)後不再提示,要再看點徽章即可
  const banner = document.getElementById("banner"); banner.replaceChildren(); banner.className = "banner";
  banner.onclick = null;
  const rh = riskHits(), rs = riskSrc();
  if (state.error) { banner.className = "banner crit"; banner.append(icon("alert", "var(--crit)"), `無法連線到資料伺服器(${state.error}),畫面是 ${ageText(Math.round(Date.now() / 1000 - state.lastOk))} 的資料`); banner.hidden = false; }
  else if (rs && rs.data && rs.data.status === "error") { banner.append(icon("alert", "var(--warn)"), `高風險 IP 偵測異常:${rs.data.message || "未知原因"}`); banner.hidden = false; }
  else if (rs && rs.stale) { banner.append(icon("alert", "var(--warn)"), `高風險 IP 偵測資料已過期(${ageText(rs.age_sec)}),請檢查 DB server 的 risk_ip_match`); banner.hidden = false; }
  else if (merakiSrc() && merakiSrc().available && merakiSrc().stale) { banner.append(icon("alert", "var(--warn)"), `Meraki 無線資料已過期(${ageText(merakiSrc().age_sec)}),AP 燈號僅供參考,請檢查 DB server 的 meraki_poll`); banner.hidden = false; }
  else banner.hidden = true;

  // 1) 新的高風險命中 → 自動彈出平面地圖(優先,會蓋過目前的彈窗;已經在看高風險視窗就只更新內容)
  const rkeys = rh.map(riskKey);
  if (rs && !rs.stale && rs.data && rs.data.status === "ok") {    // 命中消失就清掉已讀紀錄,同一個 IP 之後再出現會當成新的
    let changed = false;
    for (const k of Object.keys(state.acked)) if (!rkeys.includes(k)) { delete state.acked[k]; changed = true; }
    if (changed) saveAcked(state.acked);
  }
  const newRisk = rkeys.filter(k => !state.riskAlerted.has(k) && !state.acked[k]);   // 看過的不再自動彈出
  state.riskAlerted = new Set(rkeys);
  renderRiskChip();
  if (newRisk.length && !(state.modal && state.modal.kind === "risk" && !overlay.hidden)) {
    // 如果正被蓋掉的是「線路超標的 Top N」彈窗,把它排回隊伍最前面,高風險視窗關閉後再補跳出來
    if (state.modal && state.modal.lineId && !overlay.hidden) {
      const k = `${state.modal.lineId}:${state.modal.dir}`;
      if (overKeys.includes(k) && !state.pendingTop.includes(k)) state.pendingTop.unshift(k);
    }
    openRiskModal();
  }

  // 1.5) AP 離線 → 自動彈出該樓層平面圖(優先順序:高風險 > AP > Top N)。看過(關閉視窗/點徽章)的不再彈;AP 恢復後清掉紀錄
  if (merakiFresh()) {
    const bad = badAps(merakiSrc().data), bkeys = new Set(bad.map(x => apKey(x.ap)));
    let ch = false;
    for (const k of Object.keys(state.apAcked)) if (!bkeys.has(k)) { delete state.apAcked[k]; ch = true; }
    if (ch) saveApAcked(state.apAcked);
    const fresh = bad.filter(x => x.level === "crit" && !state.apAcked[apKey(x.ap)] && !state.apAlerted.has(apKey(x.ap)));
    state.apAlerted = new Set(bad.filter(x => x.level === "crit").map(x => apKey(x.ap)));
    renderApChip();
    const riskOpen = state.modal && state.modal.kind === "risk" && !overlay.hidden;
    const busyOpen = state.modal && (state.modal.kind === "ap" || state.modal.kind === "find" || state.modal.kind === "diag") && !overlay.hidden;   // 正在搜尋/診斷時不要被蓋掉(右上角徽章仍會提示)
    if (fresh.length && !riskOpen && !busyOpen) {
      if (state.modal && state.modal.lineId && !overlay.hidden) {       // 蓋掉 Top N 彈窗時,把它排回隊伍最前面
        const k = `${state.modal.lineId}:${state.modal.dir}`;
        if (overKeys.includes(k) && !state.pendingTop.includes(k)) state.pendingTop.unshift(k);
      }
      const cnt = {}; fresh.forEach(x => { cnt[x.floor.name] = (cnt[x.floor.name] || 0) + 1; });
      openMerakiModal(Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0], true);
    }
  } else renderApChip();

  // 2) 線路超標 → 自動跳出該線路 Top N。若當時正在顯示別的彈窗(例如高風險),先排隊,關閉後再補跳出來
  const newKeys = overKeys.filter(k => !state.alerted.has(k));
  state.alerted = new Set(overKeys);   // 恢復正常的項目會被移除,下次再超標會重新跳出
  state.pendingTop = state.pendingTop.filter(k => overKeys.includes(k));
  newKeys.forEach(k => { if (!state.pendingTop.includes(k)) state.pendingTop.push(k); });
  if (state.pendingTop.length && overlay.hidden && state.data.topn_enabled) { const [id, dir] = state.pendingTop.shift().split(":"); openTopN(id, dir, true); }
  return { incomplete };
}

/* 每個面板各自 try/catch:某一塊資料格式怪怪的,只有那一塊顯示錯誤訊息,其他照常顯示 */
function safeRender(panelId, fn) {
  try { fn(); }
  catch (err) {
    console.error(panelId, err);
    const p = document.getElementById(panelId);
    if (p) p.replaceChildren(el("div", { class: "empty" }, icon("alert", "var(--warn)"), ` 這個面板顯示失敗:${err.message}(按 F12 看 Console 可以看到詳細位置)`));
  }
}
function showFatal(msg) {
  const b = document.getElementById("banner");
  b.className = "banner crit"; b.replaceChildren(icon("alert", "var(--crit)"), msg); b.hidden = false;
  document.getElementById("subline").textContent = "無法取得資料";
}
function renderAll() {
  safeRender("p-lines", renderLines); safeRender("p-fw", renderFw); safeRender("p-avail", renderAvail); safeRender("p-threat", renderThreat);
  if (state.modal && state.modal.kind === "map" && !overlay.hidden) safeModal(renderMapModal);
  if (state.modal && state.modal.kind === "risk" && !overlay.hidden) safeModal(renderRiskModal);
  if (state.modal && state.modal.kind === "ap" && !overlay.hidden) safeModal(renderApModal);
  try { renderOverall(); } catch (err) { console.error(err); showFatal(`總覽狀態計算失敗:${err.message}`); }
  document.getElementById("subline").textContent = state.error ? "資料伺服器連線中斷" : `資料每 ${REFRESH_MS / 1000} 秒更新 · 最後成功 ${hhmm(state.lastOk)}` + (state.data && state.data.demo ? " · 示範資料(全部為模擬數字)" : "");
}

async function load() {
  document.querySelectorAll(".panel").forEach(p => p.classList.add("reloading"));   // 重新抓取時保持版面,只稍微變淡
  try {
    const res = await fetch("/api/summary", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.data = await res.json(); state.lastOk = Date.now() / 1000; state.error = null;
  } catch (err) {
    state.error = err.message;
    if (!state.data) {
      showFatal(location.protocol === "file:"
        ? "目前是直接開啟 dashboard.html 檔案,讀不到資料。請先執行 python dashboard_server.py,再用瀏覽器開 http://127.0.0.1:8080/"
        : `無法連線到資料伺服器(${err.message})。請確認 dashboard_server.py 正在執行,而且網址是它印出來的那個。`);
    }
  }
  if (state.data) renderAll();
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("reloading"));
}

function tick() {
  const n = new Date();
  document.getElementById("clock").textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  document.getElementById("date").textContent = n.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
}
tick(); setInterval(tick, 1000);
load(); setInterval(load, REFRESH_MS);
</script>
